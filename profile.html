<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile · My PDF Library</title>
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="sidebar.css">
  <link rel="stylesheet" href="profile.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="common.js" defer></script>
  <script src="sidebar.js" defer></script>
  <script src="profile.js" defer></script>
</head>
<body data-page="profile">
  <div class="app-shell">
    <aside id="sidebar" class="sidebar"></aside>

    <div class="app-content">
      <header class="page-header">
        <button id="menuToggle" class="menu-toggle" type="button" aria-label="Open menu">☰</button>
        <div>
          <h1>Profile</h1>
          <p>Your account and storage details.</p>
        </div>
      </header>

      <main id="pageMain" class="container" hidden>
        <p id="statusMessage" class="status-message" role="status"></p>

        <section class="panel profile-card">
          <div id="avatar" class="avatar" aria-hidden="true">?</div>
          <div>
            <h2 id="profileEmail">Loading...</h2>
            <p id="memberSince" class="muted-text"></p>
          </div>
        </section>

        <section class="panel">
          <h2>Account</h2>
          <dl class="detail-list">
            <div>
              <dt>Email</dt>
              <dd id="detailEmail">—</dd>
            </div>
            <div>
              <dt>Member since</dt>
              <dd id="detailCreated">—</dd>
            </div>
            <div>
              <dt>Last sign-in</dt>
              <dd id="detailLastSignIn">—</dd>
            </div>
          </dl>
        </section>

        <section class="panel">
          <h2>Storage details</h2>
          <p id="storageSummary" class="muted-text">Calculating...</p>

          <div class="storage-bar" role="progressbar"
               aria-label="Storage used" aria-valuemin="0" aria-valuemax="100"
               id="storageBar" aria-valuenow="0">
            <div id="storageFill" class="storage-fill"></div>
          </div>
          <p id="storageText" class="storage-text"></p>

          <div class="stats">
            <article class="stat-card">
              <span id="totalCount" class="stat-number">0</span>
              <span class="stat-label">PDF documents</span>
            </article>
            <article class="stat-card">
              <span id="totalSize" class="stat-number">0 KB</span>
              <span class="stat-label">Total file size</span>
            </article>
            <article class="stat-card">
              <span id="largestFile" class="stat-number">—</span>
              <span class="stat-label">Largest file</span>
            </article>
          </div>

          <h3 class="breakdown-title">Storage by subject</h3>
          <div id="subjectBreakdown" class="breakdown"></div>
        </section>
      </main>

      <div id="loadingScreen" class="loading-screen">
        Checking your sign-in...
      </div>
    </div>
  </div>
</body>
</html>
