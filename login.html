
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | My PDF Library</title>
  <link rel="stylesheet" href="login.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="login.js" defer></script>
</head>
<body>
  <main class="login-page">
    <section class="login-card">
      <div class="login-logo">PDF</div>

      <h1>My PDF Library</h1>
      <p class="subtitle">Sign in to access your personal cloud library.</p>

      <form id="loginForm" class="auth-form">
        <label for="email">Email address</label>
        <input
          id="email"
          name="email"
          type="email"
          placeholder="you@example.com"
          autocomplete="username"
          required
        >

        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >

        <button id="loginButton" type="submit">Sign In</button>
        <button id="forgotPasswordButton" class="text-button" type="button">
          Forgot password?
        </button>
      </form>

      <form id="recoveryForm" class="auth-form" hidden>
        <label for="recoveryEmail">Email address</label>
        <input
          id="recoveryEmail"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >

        <button id="sendRecoveryButton" type="submit">Send reset link</button>
        <button id="backToLoginButton" class="text-button" type="button">
          Back to sign in
        </button>
      </form>

      <form id="resetForm" class="auth-form" hidden>
        <label for="newPassword">New password</label>
        <input
          id="newPassword"
          type="password"
          autocomplete="new-password"
          required
        >

        <label for="confirmPassword">Confirm new password</label>
        <input
          id="confirmPassword"
          type="password"
          autocomplete="new-password"
          required
        >

        <button id="savePasswordButton" type="submit">Update password</button>
      </form>

      <p id="message" class="message" role="status" aria-live="polite"></p>

      <p class="auth-switch">
        New to My PDF Library? <a href="signup.html">Create an account</a>
      </p>

      <p class="privacy-text">
        Your library is private. Sign in using the account you registered
        with Supabase.
      </p>
    </section>
  </main>
</body>
</html>
