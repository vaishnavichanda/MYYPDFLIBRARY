
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | My PDF Library</title>
  <link rel="stylesheet" href="login.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="login.js" defer></script>
</head>
<body>
  <main class="login-page">
    <section class="login-card">
      <div class="login-logo">PDF</div>

      <h1>My PDF Library</h1>
      <p class="subtitle">Sign in to access your personal cloud library.</p>

      <form id="loginForm" class="auth-form">
        <label for="email">Email address</label>
        <input
          id="email"
          name="email"
          type="email"
          placeholder="you@example.com"
          autocomplete="username"
          required
        >

        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >

        <button id="loginButton" type="submit">Sign In</button>
      </form>

      <p id="message" class="message" role="status" aria-live="polite"></p>

      <p class="privacy-text">
        Your library is private. Sign in using the account you registered
        with Supabase.
      </p>
    </section>
  </main>
</body>
</html>
